<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A little question for you</title>
  <style>
    * { box-sizing: border-box; }
    :root { font-family: Georgia, 'Times New Roman', serif; color: #792638; background: #fff4f6; }
    body { margin: 0; min-height: 100svh; overflow-x: hidden; }
    main { min-height: 100svh; display: grid; place-items: center; padding: 60px 24px; position: relative; z-index: 1; }
    .invitation { width: min(100%, 700px); text-align: center; }
    .eyebrow { font: 600 11px/1.5 Arial, sans-serif; letter-spacing: 0; text-transform: uppercase; color: #a65366; }
    .heart { display: block; font-size: 76px; line-height: 1.3; margin: 30px auto 20px; filter: drop-shadow(0 10px 12px #d6355b22); }
    h1 { font-size: 64px; line-height: 1.08; font-weight: 400; margin: 0 auto 22px; letter-spacing: 0; }
    h1 em { color: #d73559; }
    .date-question { display: block; font-size: 40px; margin-top: 12px; }
    .subtitle { font: 16px/1.8 Arial, sans-serif; color: #996271; margin: 0 0 32px; }
    .buttons { display: flex; justify-content: center; gap: 16px; min-height: 54px; }
    button { width: 134px; height: 52px; border-radius: 6px; border: 1px solid #dfbdc6; font: 600 16px Arial, sans-serif; cursor: pointer; touch-action: manipulation; }
    #yes { color: white; background: #ce3154; border-color: #ce3154; box-shadow: 0 6px 18px #ce315423; transition: background .2s, transform .2s; }
    #yes:hover { background: #ac2140; transform: translateY(-2px); }
    #no { color: #985466; background: #fffafb; z-index: 5; padding: 6px 10px; font-size: 14px; line-height: 1.2; }
    button:focus-visible { outline: 3px solid #792638; outline-offset: 5px; }
    .footer { margin-top: 58px; font: italic 14px Georgia, serif; color: #aa7380; }
    #balloons { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .balloon { position: absolute; bottom: -240px; left: var(--left); font-size: var(--size); animation: float var(--duration) linear infinite; animation-delay: var(--delay); opacity: .65; }
    .balloon::after { content: ''; display: block; width: 1px; height: 110px; background: #d890a4; margin: -7px auto 0; }
    @keyframes float { 0% { transform: translate(0, 0) rotate(-12deg); } 50% { transform: translate(35px, -65vh) rotate(12deg); } 100% { transform: translate(-20px, calc(-100vh - 300px)) rotate(-8deg); } }
    .date { border-top: 1px solid #eac4ce; border-bottom: 1px solid #eac4ce; padding: 23px 8px; margin: 30px auto 0; max-width: 360px; }
    .date strong { display: block; font-size: 25px; font-weight: 400; margin-bottom: 9px; }
    .date span { font: 14px Arial, sans-serif; color: #996271; }
    [hidden] { display: none !important; }
    @media (max-width: 540px) { h1 { font-size: 44px; } .heart { font-size: 64px; } .balloon { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { .balloon { animation: none; bottom: var(--rest); } button { transition: none !important; } }
  </style>
</head>
<body>
  <div id="balloons" aria-hidden="true"></div>
  <main>
    <section class="invitation" aria-live="polite">
      <p class="eyebrow">For my favorite person</p>
      <span class="heart" aria-hidden="true">💌</span>
      <div id="question">
        <h1>dhanu<em class="date-question">will you be my Date ?</em></h1>
        <p class="subtitle">Choose wisely (The "No" button is ...shy).</p>
        <div class="buttons">
          <button id="yes" type="button">Yes ♥</button>
          <button id="no" type="button">No</button>
        </div>
      </div>
      <div id="answer" hidden>
        <h1 tabindex="-1" id="answer-heading">I knew you'd<br><em>say yes!</em></h1>
        <p class="subtitle">It's a date. I'll meet you at your favourite location ...</p>
        <div class="date"><span>whenever You want &middot; Just us two &#9829;</span></div>
      </div>
      <p class="footer" id="footer">You make ordinary days feel a little more magical.</p>
    </section>
  </main>
  <script>
    const balloons = document.getElementById('balloons');
    for (let i = 0; i < 14; i++) {
      const balloon = document.createElement('span');
      balloon.className = 'balloon';
      balloon.textContent = i % 3 === 0 ? '💗' : '❤️';
      balloon.style.setProperty('--left', `${i * 7.5}%`);
      balloon.style.setProperty('--size', `${26 + (i % 4) * 10}px`);
      balloon.style.setProperty('--duration', `${17 + i % 6 * 2}s`);
      balloon.style.setProperty('--delay', `${-i * 3}s`);
      balloon.style.setProperty('--rest', `${(i * 17) % 95}%`);
      balloons.appendChild(balloon);
    }

    const no = document.getElementById('no');
    const yes = document.getElementById('yes');
    const noMessages = ["Don't do this", 'Please no', 'Please no', 'This could be a mistake'];
    let noAttempts = 0;
    function moveNo(event) {
      if (event) event.preventDefault();
      if (event) {
        no.textContent = noMessages[noAttempts % noMessages.length];
        noAttempts++;
      }
      const margin = 16;
      const maxX = Math.max(margin, window.innerWidth - no.offsetWidth - margin);
      const maxY = Math.max(margin, window.innerHeight - no.offsetHeight - margin);
      const yesRect = yes.getBoundingClientRect();
      let x, y;
      for (let attempt = 0; attempt < 40; attempt++) {
        x = margin + Math.random() * (maxX - margin);
        y = margin + Math.random() * (maxY - margin);
        const overlapsYes = x < yesRect.right + 20 && x + no.offsetWidth > yesRect.left - 20 && y < yesRect.bottom + 20 && y + no.offsetHeight > yesRect.top - 20;
        const nearPointer = event && Number.isFinite(event.clientX) && Math.abs(x + no.offsetWidth / 2 - event.clientX) < 155 && Math.abs(y + no.offsetHeight / 2 - event.clientY) < 95;
        if (!overlapsYes && !nearPointer) break;
      }
      // Keep the original button's layout space so Yes does not shift.
      if (no.style.position !== 'fixed') {
        const spacer = document.createElement('span');
        spacer.style.cssText = 'width:134px;height:52px;flex-shrink:0';
        no.before(spacer);
      }
      no.style.position = 'fixed';
      no.style.left = `${x}px`;
      no.style.top = `${y}px`;
    }
    no.addEventListener('pointerenter', event => { if (event.pointerType === 'mouse') moveNo(event); });
    no.addEventListener('pointerdown', moveNo);
    no.addEventListener('click', event => {
      // Pointer attempts are handled above; clicks with no detail come from the keyboard.
      if (event.detail === 0) moveNo(event);
    });
    window.addEventListener('resize', () => { if (no.style.position === 'fixed' && !no.hidden) moveNo(); });
    yes.addEventListener('click', () => {
      document.getElementById('question').hidden = true;
      document.getElementById('answer').hidden = false;
      document.querySelector('.heart').textContent = '💖';
      document.getElementById('footer').textContent = "Can't wait to see you, dhanu.";
      no.hidden = true;
      document.getElementById('answer-heading').focus();
    });
  </script>
</body>
</html>
